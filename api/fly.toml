# Fly.io app spec for the AngelCare Transit API.
#
# Deploy with (run from the api/ directory):
#   flyctl deploy
#
# Secrets (DJANGO_SECRET_KEY, DATABASE_URL, etc.) are NOT set here --
# they're set via `flyctl secrets set` so they never land in git. See
# docs/decisions/0003-supabase-and-flyio.md.
app = "angelcare-api"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz/"

[deploy]
  release_command = "python manage.py migrate --noinput"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
