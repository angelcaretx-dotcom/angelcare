<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0; border-collapse:collapse;">
{% for label, value in rows %}
  <tr>
    <td style="padding:10px 0; {% if not forloop.last %}border-bottom:1px solid #eef1f3; {% endif %}width:150px; vertical-align:top; font-size:11px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; color:#8a97a5; white-space:nowrap;">
      {{ label }}
    </td>
    <td style="padding:10px 0 10px 16px; {% if not forloop.last %}border-bottom:1px solid #eef1f3; {% endif %}vertical-align:top; font-size:14px; color:#1f2933;">
      {{ value }}
    </td>
  </tr>
{% endfor %}
</table>
