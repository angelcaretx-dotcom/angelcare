name: Deploy API to Fly.io

# Deploys api/ to Fly.io on every push to main that touches api/.
# Requires a repo secret FLY_API_TOKEN (Settings -> Secrets and
# variables -> Actions), created via `fly tokens create deploy` --
# see docs/decisions/0003-supabase-and-flyio.md for the one-time setup
# this workflow depends on (the Fly app and its `fly secrets` must
# already exist before the first run).

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py test transportation
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-used-in-production
          DJANGO_DEBUG: "True"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
